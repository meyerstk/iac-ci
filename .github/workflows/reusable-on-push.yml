---
name: Reusable On Push

on:
  workflow_call:

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.3

  filesystem-scan:
    name: Scan repository filesystem
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan repository filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  test:
    name: Validate test target
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test target
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: test
          cache-from: type=gha,scope=test
          cache-to: type=gha,scope=test,mode=max,ignore-error=true

  image-scan:
    name: Scan ${{ matrix.target }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - dev
          - runtime

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.target }} target
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          load: true
          tags: app-ivt-py:ci-${{ matrix.target }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max,ignore-error=true

      - name: Scan ${{ matrix.target }} image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: app-ivt-py:ci-${{ matrix.target }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  required-check:
    name: Required
    needs:
      - codeql
      - filesystem-scan
      - test
      - image-scan
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Verify all checks passed
        env:
          CODEQL_RESULT: ${{ needs.codeql.result }}
          FILESYSTEM_SCAN_RESULT: ${{ needs.filesystem-scan.result }}
          TEST_RESULT: ${{ needs.test.result }}
          IMAGE_SCAN_RESULT: ${{ needs.image-scan.result }}
        shell: bash
        run: |
          for result in \
            "$CODEQL_RESULT" \
            "$FILESYSTEM_SCAN_RESULT" \
            "$TEST_RESULT" \
            "$IMAGE_SCAN_RESULT"
          do
            if [[ "$result" != "success" ]]; then
              echo "A required job finished with: $result"
              exit 1
            fi
          done

          echo "All required checks passed."