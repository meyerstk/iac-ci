name: On Merge

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Example for consuming repositories:
  #
  # deploy:
  #   uses: meyerstk/iac-ci/.github/workflows/reusable-on-merge.yml@main
  #   secrets: inherit

  demo:
    name: Demo on-merge workflow
    runs-on: ubuntu-latest
    steps:
      - name: Succeed without publishing
        run: echo "Reusable on-merge workflow call is disabled in the demo repository."
